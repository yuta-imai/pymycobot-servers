openapi: 3.0.3
info:
  title: MyCobot Joint Controller REST API
  description: REST API for controlling MyCobot robot joints remotely
  version: 1.0.0
  contact:
    name: MyCobot API
    url: https://github.com/elephantrobotics/pymycobot

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: http://0.0.0.0:8080
    description: External access server

tags:
  - name: joints
    description: Individual joint operations
  - name: gripper
    description: Gripper control operations
  - name: robot
    description: Overall robot operations
  - name: system
    description: System status and control

paths:
  /health:
    get:
      tags:
        - system
      summary: Health check
      description: Check if the API server and robot connection are healthy
      operationId: health_check
      responses:
        '200':
          description: System is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /joints/{joint_num}/angle:
    get:
      tags:
        - joints
      summary: Get joint angle
      description: Get current angle of a specific joint
      operationId: get_joint_angle
      parameters:
        - name: joint_num
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 6
          description: Joint number (1-6)
      responses:
        '200':
          description: Current joint angle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JointAngleResponse'
        '400':
          description: Invalid joint number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Robot connection error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - joints
      summary: Move joint to angle
      description: Move a specific joint to target angle
      operationId: move_joint
      parameters:
        - name: joint_num
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 6
          description: Joint number (1-6)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveJointRequest'
      responses:
        '200':
          description: Joint movement command sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Robot connection error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /joints/angles:
    get:
      tags:
        - joints
      summary: Get all joint angles
      description: Get current angles of all joints
      operationId: get_all_joint_angles
      responses:
        '200':
          description: Current angles of all joints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllJointAnglesResponse'
        '503':
          description: Robot connection error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - joints
      summary: Move all joints
      description: Move all joints to specified angles simultaneously
      operationId: move_all_joints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveAllJointsRequest'
      responses:
        '200':
          description: All joints movement command sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Robot connection error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /joints/{joint_num}/jog:
    post:
      tags:
        - joints
      summary: Jog joint
      description: Jog a joint in specified direction
      operationId: jog_joint
      parameters:
        - name: joint_num
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 6
          description: Joint number (1-6)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JogJointRequest'
      responses:
        '200':
          description: Joint jog command sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Robot connection error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /gripper/open:
    post:
      tags:
        - gripper
      summary: Open gripper
      description: Open gripper
      operationId: open_gripper
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GripperActionRequest'
      responses:
        '200':
          description: Gripper open command sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Robot connection error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /gripper/close:
    post:
      tags:
        - gripper
      summary: Close gripper
      description: Close gripper
      operationId: close_gripper
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GripperActionRequest'
      responses:
        '200':
          description: Gripper close command sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Robot connection error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /gripper/release:
    post:
      tags:
        - gripper
      summary: Release gripper
      description: Release gripper (firmware-supported torque release mode)
      operationId: release_gripper
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GripperActionRequest'
      responses:
        '200':
          description: Gripper release command sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Robot connection error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /gripper/state:
    put:
      tags:
        - gripper
      summary: Set gripper state
      description: Set gripper state directly (0=open, 1=close, 10=release)
      operationId: set_gripper_state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GripperStateRequest'
      responses:
        '200':
          description: Gripper state command sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Robot connection error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /gripper/value:
    put:
      tags:
        - gripper
      summary: Set gripper value
      description: Set gripper opening value (0-100)
      operationId: set_gripper_value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GripperValueRequest'
      responses:
        '200':
          description: Gripper value command sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Robot connection error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /gripper/calibrate:
    post:
      tags:
        - gripper
      summary: Calibrate gripper
      description: Calibrate gripper and set current position as reference
      operationId: calibrate_gripper
      responses:
        '200':
          description: Gripper calibration command sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '503':
          description: Robot connection error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /gripper/status:
    get:
      tags:
        - gripper
      summary: Get gripper status
      description: Get current gripper opening value (0-100) and whether it is moving
      operationId: get_gripper_status
      parameters:
        - name: gripper_type
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 4
          description: "Gripper type (1=adaptive, 3=parallel, 4=flexible); firmware default when omitted"
      responses:
        '200':
          description: Current gripper status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GripperStatusResponse'
        '400':
          description: Invalid gripper type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Robot connection error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /robot/home:
    post:
      tags:
        - robot
      summary: Move to home position
      description: Move all joints to home position (0 degrees)
      operationId: home_position
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeedRequest'
      responses:
        '200':
          description: Home position command sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '503':
          description: Robot connection error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /robot/stop:
    post:
      tags:
        - robot
      summary: Stop all joints
      description: Emergency stop for all joint movements
      operationId: stop_all_joints
      responses:
        '200':
          description: Stop command sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '503':
          description: Robot connection error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /robot/status:
    get:
      tags:
        - robot
      summary: Get robot status
      description: Get current robot status including joint angles and movement state
      operationId: get_robot_status
      parameters:
        - name: include_error
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: "Also report the firmware error code/message (extra serial round-trip)"
      responses:
        '200':
          description: Current robot status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RobotStatusResponse'
        '503':
          description: Robot connection error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /robot/wait:
    post:
      tags:
        - robot
      summary: Wait for movement completion
      description: Wait for robot to complete current movement
      operationId: wait_for_completion
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaitRequest'
      responses:
        '200':
          description: Movement completed or timeout reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitResponse'
        '503':
          description: Robot connection error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /robot/coords:
    get:
      tags:
        - robot
      summary: Get current pose
      description: Get the current end-effector pose [x, y, z, rx, ry, rz] in mm / degrees
      operationId: get_coords
      responses:
        '200':
          description: Current Cartesian pose
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoordsResponse'
        '503':
          description: Robot connection error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - robot
      summary: Move to pose
      description: Move the end-effector to an absolute Cartesian pose (non-blocking)
      operationId: move_coords
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveCoordsRequest'
      responses:
        '200':
          description: Coordinate movement command sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid parameters (out of workspace range, bad mode/speed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Robot connection error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /robot/coords/check:
    post:
      tags:
        - robot
      summary: Check pose reachability
      description: Check, without moving, whether a Cartesian pose is reachable (firmware IK)
      operationId: check_coords_reachable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoordsRequest'
      responses:
        '200':
          description: Reachability result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReachableResponse'
        '503':
          description: Robot connection error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /robot/coords/wait:
    post:
      tags:
        - robot
      summary: Wait for pose arrival
      description: Wait until the end-effector reaches its Cartesian target (converged / ik_no_solution / stalled / timeout)
      operationId: wait_for_coords
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaitCoordsRequest'
      responses:
        '200':
          description: Target reached or terminal condition met
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitCoordsResponse'
        '503':
          description: Robot connection error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "healthy"
        robot_connected:
          type: boolean
          example: true
        api_version:
          type: string
          example: "1.0.0"
      required:
        - status
        - robot_connected
        - api_version

    JointAngleResponse:
      type: object
      properties:
        joint_num:
          type: integer
          minimum: 1
          maximum: 6
          example: 1
        angle:
          type: number
          format: float
          example: 45.5
        timestamp:
          type: string
          format: date-time
          example: "2023-12-01T12:00:00Z"
      required:
        - joint_num
        - angle
        - timestamp

    AllJointAnglesResponse:
      type: object
      properties:
        angles:
          type: array
          items:
            type: number
            format: float
          minItems: 6
          maxItems: 6
          example: [0.0, 45.5, -30.2, 90.0, -15.5, 60.0]
        timestamp:
          type: string
          format: date-time
          example: "2023-12-01T12:00:00Z"
      required:
        - angles
        - timestamp

    RobotStatusResponse:
      type: object
      properties:
        joint_angles:
          type: array
          items:
            type: number
            format: float
          minItems: 6
          maxItems: 6
          example: [0.0, 45.5, -30.2, 90.0, -15.5, 60.0]
        is_moving:
          type: boolean
          example: false
        timestamp:
          type: string
          format: date-time
          example: "2023-12-01T12:00:00Z"
        error_code:
          type: integer
          nullable: true
          example: null
          description: "Firmware error code (only set when include_error=true and an error is present)"
        error_message:
          type: string
          nullable: true
          example: null
          description: "Human-readable error description for error_code"
      required:
        - joint_angles
        - is_moving
        - timestamp

    GripperStatusResponse:
      type: object
      properties:
        value:
          type: integer
          minimum: 0
          maximum: 100
          example: 100
          description: "Current gripper opening value (0-100)"
        is_moving:
          type: boolean
          example: false
        timestamp:
          type: string
          format: date-time
          example: "2023-12-01T12:00:00Z"
      required:
        - value
        - is_moving
        - timestamp

    MoveJointRequest:
      type: object
      properties:
        angle:
          type: number
          format: float
          minimum: -180
          maximum: 180
          example: 45.5
        speed:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
          example: 50
      required:
        - angle

    MoveAllJointsRequest:
      type: object
      properties:
        angles:
          type: array
          items:
            type: number
            format: float
            minimum: -175
            maximum: 175
          minItems: 6
          maxItems: 6
          example: [0.0, 45.5, -30.2, 90.0, -15.5, 60.0]
        speed:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
          example: 50
      required:
        - angles

    JogJointRequest:
      type: object
      properties:
        direction:
          type: integer
          enum: [-1, 1]
          example: 1
          description: "1 for positive direction, -1 for negative direction"
        speed:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
          example: 50
        increment:
          type: number
          format: float
          minimum: 0
          exclusiveMinimum: true
          maximum: 90
          default: 5.0
          example: 5.0
          description: "Degrees to move per call (0 < increment <= 90)"
      required:
        - direction

    SpeedRequest:
      type: object
      properties:
        speed:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
          example: 50

    WaitRequest:
      type: object
      properties:
        timeout:
          type: number
          format: float
          minimum: 0.1
          maximum: 60.0
          default: 15.0
          example: 15.0
          description: "Maximum time to wait in seconds"
        tolerance:
          type: number
          format: float
          minimum: 0.0
          maximum: 10.0
          default: 1.0
          example: 1.0
          description: "Per-joint convergence tolerance in degrees"
        target:
          type: array
          items:
            type: number
            format: float
          minItems: 6
          maxItems: 6
          nullable: true
          description: "Optional explicit 6-joint target. Defaults to the last commanded target."

    GripperActionRequest:
      type: object
      properties:
        speed:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
          example: 50
          description: "Gripper movement speed (1-100)"
        gripper_type:
          type: integer
          minimum: 1
          maximum: 4
          nullable: true
          example: 1
          description: "Gripper type: 1=adaptive, 2=5-finger dexterous, 3=parallel, 4=flexible"

    GripperStateRequest:
      type: object
      properties:
        state:
          type: integer
          enum: [0, 1, 10]
          example: 1
          description: "0=open, 1=close, 10=release"
        speed:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
          example: 50
          description: "Gripper movement speed (1-100)"
        gripper_type:
          type: integer
          minimum: 1
          maximum: 4
          nullable: true
          example: 1
          description: "Gripper type: 1=adaptive, 2=5-finger dexterous, 3=parallel, 4=flexible"
      required:
        - state

    GripperValueRequest:
      type: object
      properties:
        value:
          type: integer
          minimum: 0
          maximum: 100
          example: 50
          description: "Gripper opening value (0-100)"
        speed:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
          example: 50
          description: "Gripper movement speed (1-100)"
        gripper_type:
          type: integer
          minimum: 1
          maximum: 4
          nullable: true
          example: 1
          description: "Gripper type (set value supports 1=adaptive, 3=parallel, 4=flexible)"
      required:
        - value

    WaitResponse:
      type: object
      properties:
        completed:
          type: boolean
          example: true
          description: "True if the target was reached (converged), False otherwise"
        elapsed_time:
          type: number
          format: float
          example: 2.5
          description: "Actual time elapsed in seconds"
        reason:
          type: string
          enum: [converged, stalled, timeout, idle]
          example: converged
          description: "Terminal condition: converged (success), stalled, timeout, or idle (legacy fallback)"
        max_error:
          type: number
          format: float
          nullable: true
          example: 0.3
          description: "Maximum per-joint error to target in degrees at return time (null if unknown)"
      required:
        - completed
        - elapsed_time
        - reason

    MoveCoordsRequest:
      type: object
      properties:
        coords:
          type: array
          items:
            type: number
            format: float
          minItems: 6
          maxItems: 6
          example: [160.0, -60.0, 200.0, -90.0, 0.0, -90.0]
          description: "Target pose [x, y, z, rx, ry, rz] in mm / degrees"
        speed:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
          example: 30
          description: "Movement speed (1-100)"
        mode:
          type: integer
          enum: [0, 1]
          default: 0
          example: 0
          description: "0 = angular (point-to-point), 1 = linear (straight-line)"
        validate:
          type: boolean
          default: true
          description: "Run a no-move IK reachability check before sending; reject unreachable poses with 400"
      required:
        - coords

    CoordsRequest:
      type: object
      properties:
        coords:
          type: array
          items:
            type: number
            format: float
          minItems: 6
          maxItems: 6
          example: [160.0, -60.0, 200.0, -90.0, 0.0, -90.0]
          description: "Pose [x, y, z, rx, ry, rz] in mm / degrees"
      required:
        - coords

    WaitCoordsRequest:
      type: object
      properties:
        target:
          type: array
          items:
            type: number
            format: float
          minItems: 6
          maxItems: 6
          nullable: true
          description: "Optional explicit target pose [x,y,z,rx,ry,rz]. Defaults to the last commanded coords target."
        pos_tolerance:
          type: number
          format: float
          minimum: 0.0
          maximum: 50.0
          default: 3.0
          description: "Position convergence tolerance in mm"
        ori_tolerance:
          type: number
          format: float
          minimum: 0.0
          maximum: 45.0
          default: 3.0
          description: "Orientation convergence tolerance in degrees"
        timeout:
          type: number
          format: float
          minimum: 0.1
          maximum: 60.0
          default: 20.0
          description: "Maximum time to wait in seconds"

    CoordsResponse:
      type: object
      properties:
        coords:
          type: array
          items:
            type: number
            format: float
          minItems: 6
          maxItems: 6
          example: [160.0, -60.0, 200.0, -90.0, 0.0, -90.0]
        timestamp:
          type: string
          format: date-time
          example: "2023-12-01T12:00:00Z"
      required:
        - coords
        - timestamp

    WaitCoordsResponse:
      type: object
      properties:
        completed:
          type: boolean
          example: true
        elapsed_time:
          type: number
          format: float
          example: 2.5
        reason:
          type: string
          enum: [converged, ik_no_solution, robot_fault, stalled, timeout, no_target]
          example: converged
          description: "Terminal condition"
        pos_error:
          type: number
          format: float
          nullable: true
          description: "Max position error to target in mm at return time"
        ori_error:
          type: number
          format: float
          nullable: true
          description: "Max orientation error to target in degrees at return time"
      required:
        - completed
        - elapsed_time
        - reason

    ReachableResponse:
      type: object
      properties:
        reachable:
          type: boolean
          example: true
        reason:
          type: string
          enum: [ok, out_of_range, ik_failed, joint_limit]
          example: ok
        ik_angles:
          type: array
          items:
            type: number
            format: float
          minItems: 6
          maxItems: 6
          nullable: true
          description: "IK joint solution in degrees (null if unreachable)"
        timestamp:
          type: string
          format: date-time
      required:
        - reachable
        - reason
        - timestamp

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Command executed successfully"
        timestamp:
          type: string
          format: date-time
          example: "2023-12-01T12:00:00Z"
      required:
        - success
        - message
        - timestamp

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "Invalid joint number"
        message:
          type: string
          example: "Joint number must be between 1-6, got 7"
        timestamp:
          type: string
          format: date-time
          example: "2023-12-01T12:00:00Z"
      required:
        - error
        - message
        - timestamp